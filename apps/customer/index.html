<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="BookMyWarehouse — discover and book verified warehouses, equipment and logistics services across India with live quotes and GST-ready invoices."
    />
    <meta property="og:title" content="BookMyWarehouse — Warehouses, Equipment & Logistics" />
    <meta
      property="og:description"
      content="Discover and book verified warehouses, equipment and logistics services across India with live quotes and GST-ready invoices."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bookmywarehouse.vercel.app/" />
    <meta
      property="og:image"
      content="https://bookmywarehouse.vercel.app/icons/icon-512.png"
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:image"
      content="https://bookmywarehouse.vercel.app/icons/icon-512.png"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>BookMyWarehouse — Customer</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('bmw-theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0a0a0a' : '#f8fafc');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
