<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="BookMyWarehouse Admin Console — Manage users, partners, listings, bookings, payments, disputes and platform settings." />
    <meta property="og:title" content="BookMyWarehouse — Admin Console" />
    <meta
      property="og:description"
      content="Private operations console for BookMyWarehouse — users, bookings, disputes, listings and platform settings."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookMyWarehouse" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:image" content="/icons/icon-512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Admin · BookMyWarehouse</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('bmw-theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0a0a0a' : '#f8fafc');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
